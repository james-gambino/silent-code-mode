name: Publish to JetBrains Marketplace
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - name: Validate and verify before publication
        run: gradle --no-daemon clean check verifyPluginProjectConfiguration buildPlugin verifyPlugin
      - name: Publish signed plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          test -n "$PUBLISH_TOKEN" || { echo 'Missing PUBLISH_TOKEN'; exit 1; }
          test -n "$PRIVATE_KEY" || { echo 'Missing PRIVATE_KEY'; exit 1; }
          test -n "$PRIVATE_KEY_PASSWORD" || { echo 'Missing PRIVATE_KEY_PASSWORD'; exit 1; }
          test -n "$CERTIFICATE_CHAIN" || { echo 'Missing CERTIFICATE_CHAIN'; exit 1; }
          gradle --no-daemon signPlugin publishPlugin
