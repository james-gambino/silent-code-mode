name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - name: Compile, test, validate descriptor and build ZIP
        run: gradle --no-daemon clean check verifyPluginProjectConfiguration buildPlugin
      - name: Verify Rider, WebStorm and PyCharm versions
        run: gradle --no-daemon verifyPlugin
      - name: Upload installable plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: silent-code-mode-installable
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
